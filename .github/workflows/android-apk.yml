name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-apk.yml"
      - "static/icons/app-icon-1024.png"

permissions:
  contents: write

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Missing repository secret: KEYSTORE_BASE64"; missing=1; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "Missing repository secret: KEYSTORE_PASSWORD"; missing=1; fi
          if [ -z "$KEY_ALIAS" ]; then echo "Missing repository secret: KEY_ALIAS"; missing=1; fi
          if [ -z "$KEY_PASSWORD" ]; then echo "Missing repository secret: KEY_PASSWORD"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD in Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - name: Read version from Gradle
        id: ver
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path("mobile/android/app/build.gradle").read_text(encoding="utf-8")
          code = re.search(r"versionCode\s+(\d+)", text).group(1)
          name = re.search(r'versionName\s+"([^"]+)"', text).group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"code={code}\n")
              fh.write(f"name={name}\n")
              fh.write(f"tag=android-{name}\n")
          print(f"versionName={name} versionCode={code}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-33 build-tools;34.0.0"

      - name: Write signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          raw = re.sub(r"\s+", "", os.environ["KEYSTORE_BASE64"])
          data = base64.b64decode(raw)
          if len(data) < 64:
              raise SystemExit(f"KEYSTORE_BASE64 decoded to {len(data)} bytes, too small")
          keystore_dir = Path("mobile/android/keystore")
          keystore_dir.mkdir(parents=True, exist_ok=True)
          (keystore_dir / "shuran.jks").write_bytes(data)
          Path("mobile/android/keystore.properties").write_text(
              "storeFile=keystore/shuran.jks\n"
              f"storePassword={os.environ['KEYSTORE_PASSWORD']}\n"
              f"keyAlias={os.environ['KEY_ALIAS']}\n"
              f"keyPassword={os.environ['KEY_PASSWORD']}\n",
              encoding="utf-8",
          )
          print(f"Wrote keystore ({len(data)} bytes)")
          PY

      - name: Write local.properties
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Android SDK path is empty"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$SDK" > mobile/android/local.properties
          echo "sdk.dir=$SDK"

      - name: Assemble signed release
        working-directory: mobile/android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Package shuran.apk
        run: |
          SIGNED="mobile/android/app/build/outputs/apk/release/app-release.apk"
          UNSIGNED="mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$SIGNED" ]; then
            echo "Signed APK missing at $SIGNED"
            ls -la mobile/android/app/build/outputs/apk/release || true
            if [ -f "$UNSIGNED" ]; then
              echo "Gradle produced an unsigned APK. Signing secrets did not apply."
            fi
            exit 1
          fi
          cp "$SIGNED" shuran.apk
          ls -lh shuran.apk
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort | tail -n 1)"
          "$APKSIGNER" verify --print-certs shuran.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuran-apk
          path: shuran.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Android ${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})
          body: Signed Android package ${{ steps.ver.outputs.name }} / versionCode ${{ steps.ver.outputs.code }}.
          files: shuran.apk
          fail_on_unmatched_files: true
          make_latest: true
