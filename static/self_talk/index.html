<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Self-talk - 读书反馈应用</title>
    <link rel="stylesheet" href="/static/css/self-talk-player.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
            position: relative;
            padding-top: 8px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .card h2 {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .recording-section {
            text-align: center;
        }

        .record-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .record-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
        }

        .record-button.recording {
            background: linear-gradient(135deg, #ff4757, #c44569);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .upload-section {
            margin-top: 20px;
        }

        .file-input {
            width: 100%;
            padding: 12px;
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            background: #f7fafc;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .file-input:hover {
            border-color: #667eea;
            background: #edf2f7;
        }

        .upload-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .upload-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .recognize-option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 8px 0 16px;
            padding: 12px 14px;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            user-select: none;
        }

        .recognize-option input {
            margin-top: 3px;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            accent-color: #667eea;
        }

        .recognize-option-title {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #2d3748;
        }

        .recognize-option-hint {
            display: block;
            margin-top: 4px;
            font-size: 0.8rem;
            font-weight: 400;
            color: #718096;
            line-height: 1.4;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .history-section {
            grid-column: 1 / -1;
        }

        .self-talk-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }

        .self-talk-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .self-talk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .self-talk-date {
            color: #718096;
            font-size: 0.9rem;
        }

        .self-talk-actions {
            display: flex;
            gap: 10px;
        }

        .action-button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .play-button {
            background: #48bb78;
            color: white;
        }

        .play-button:hover {
            background: #38a169;
        }

        .delete-button {
            background: #f56565;
            color: white;
        }

        .delete-button:hover {
            background: #e53e3e;
        }

        .transcript-block {
            margin-top: 15px;
        }

        .transcript-label {
            font-size: 0.85rem;
            color: #718096;
            margin-bottom: 6px;
        }

        .transcript-preview {
            background: #f7fafc;
            padding: 12px 14px;
            border-radius: 8px;
            line-height: 1.6;
            color: #4a5568;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .edit-hint {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #a0aec0;
        }

        .transcript-editor {
            width: 100%;
            min-height: 88px;
            padding: 12px 14px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            background: #fff;
            line-height: 1.6;
            color: #2d3748;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            cursor: text;
        }

        .transcript-editor:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .transcript-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }

        .save-transcript-button {
            background: #667eea;
            color: white;
        }

        .save-transcript-button:hover {
            background: #5a67d8;
        }

        .save-transcript-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .transcript-sync-status {
            margin-top: 6px;
            font-size: 0.8rem;
            color: #48bb78;
            min-height: 1.2em;
        }

        .transcript-sync-status.pending {
            color: #718096;
        }

        .transcript-sync-status.error {
            color: #e53e3e;
        }

        .no-transcript {
            color: #a0aec0;
            font-style: italic;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .st-topbar {
            position: sticky;
            top: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top, 12px));
            margin: 0 -20px 16px;
            background: #5b6fd6;
        }

        .back-button,
        .settings-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 1rem;
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            pointer-events: auto;
            border: none;
        }

        .back-button {
            background: rgba(255, 255, 255, 0.22);
            color: white;
            backdrop-filter: blur(10px);
            z-index: 10001;
        }

        .back-button:hover,
        .back-button:active {
            background: rgba(255, 255, 255, 0.35);
        }

        .settings-button {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            border: 2px solid #667eea;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .container {
                padding: 0 15px 15px;
            }

            .st-topbar {
                margin: 0 -15px 16px;
            }

            .settings-button {
                padding: 8px 12px;
                font-size: 0.9rem;
            }
        }

        html.embed-mode .st-topbar {
            display: none;
        }

        html.embed-mode .header {
            padding-top: 8px;
            margin-bottom: 20px;
        }

        html.embed-mode body {
            min-height: 100%;
            background: #f5f7fa;
        }
    </style>
    <link rel="stylesheet" href="/static/css/app-tabbar.css">
</head>
<body>
    <script>
        if (new URLSearchParams(location.search).get('embed') === '1') {
            document.documentElement.classList.add('embed-mode');
        }
    </script>
    <div class="container">
        <div class="st-topbar">
            <a href="/static/index.html" class="back-button" id="selfTalkBackBtn">← 返回</a>
            <a href="/static/index.html#user-center" class="settings-button">🔔 提醒设置</a>
        </div>
        <div class="header">
            <h1>🎤 Self-talk</h1>
            <p>记录你的内心对话，让思考更有力量</p>
        </div>

        <div class="main-content">
            <!-- 录音区域 -->
            <div class="card recording-section">
                <h2>开始录音</h2>
                <button id="recordButton" class="record-button" onclick="toggleRecording()">
                    🎤 开始录音
                </button>
                <div id="recordingStatus" class="status" style="display: none;"></div>
                
                <div class="upload-section">
                    <h3>或上传音频文件</h3>
                    <label class="recognize-option" for="recognizeTextCheckbox">
                        <input type="checkbox" id="recognizeTextCheckbox">
                        <span>
                            <span class="recognize-option-title">识别文字</span>
                            <span class="recognize-option-hint">勾选后会把语音转成文字，可能需要更长时间。不勾选则只保存音频，上传后即可播放。</span>
                        </span>
                    </label>
                    <input type="file" id="audioFile" class="file-input" accept="audio/*,.m4a,.mp3,.wav,.ogg,.webm,.mp4">
                    <button id="uploadButton" class="upload-button" onclick="uploadAudio()">
                        上传音频
                    </button>
                    <div id="uploadStatus" class="status" style="display: none;"></div>
                </div>
            </div>

            <!-- 历史记录区域 -->
            <div class="card">
                <h2>历史记录</h2>
                <div id="historyList">
                    <div class="loading"></div>
                    <p style="text-align: center; margin-top: 10px;">加载中...</p>
                </div>
            </div>
        </div>

        <!-- 历史记录详情 -->
        <div class="card history-section">
            <h2>所有 Self-talk 记录</h2>
            <div id="allHistoryList">
                <div class="loading"></div>
                <p style="text-align: center; margin-top: 10px;">加载中...</p>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let audioBlob = null;

        // 检查浏览器支持
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert('您的浏览器不支持录音功能，请使用现代浏览器');
        }

        function homeUrl() {
            return (window.location.origin || '') + '/static/index.html';
        }

        function goBack(event) {
            if (event) {
                event.preventDefault();
            }
            window.location.href = homeUrl();
            return false;
        }

        function goToReminderSettings() {
            window.location.href = homeUrl() + '#user-center';
        }

        window.handleAppBack = function () {
            goBack();
            return 'consumed';
        };

        document.addEventListener('click', function (event) {
            const backBtn = event.target.closest('#selfTalkBackBtn');
            if (!backBtn) return;
            goBack(event);
        }, true);

        // 切换录音状态
        async function toggleRecording() {
            if (!isRecording) {
                await startRecording();
            } else {
                stopRecording();
            }
        }

        // 开始录音
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });
                
                // 尝试使用 WAV 格式，如果不支持则回退到其他格式
                let mimeType = 'audio/wav';
                if (!MediaRecorder.isTypeSupported('audio/wav')) {
                    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                        mimeType = 'audio/webm;codecs=opus';
                    } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                        mimeType = 'audio/webm';
                    } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
                        mimeType = 'audio/mp4';
                    } else {
                        mimeType = 'audio/webm'; // 默认回退
                    }
                }
                
                console.log('使用录音格式:', mimeType);
                
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: mimeType
                });
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: mimeType });
                    showStatus('recordingStatus', '录音完成！可以上传了', 'success');
                    
                    // 自动上传录音
                    uploadRecording();
                };

                mediaRecorder.start();
                isRecording = true;
                
                document.getElementById('recordButton').textContent = '⏹️ 停止录音';
                document.getElementById('recordButton').classList.add('recording');
                showStatus('recordingStatus', '正在录音...', 'info');
                
            } catch (error) {
                console.error('录音失败:', error);
                showStatus('recordingStatus', '录音失败，请检查麦克风权限', 'error');
            }
        }

        // 停止录音
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                
                isRecording = false;
                document.getElementById('recordButton').textContent = '🎤 开始录音';
                document.getElementById('recordButton').classList.remove('recording');
            }
        }

        function asciiAudioFilename(name) {
            const raw = String(name || 'audio.mp3');
            const match = raw.toLowerCase().match(/\.(wav|mp3|m4a|ogg|webm|mp4)$/);
            const ext = match ? match[0] : '.mp3';
            return 'selftalk_' + Date.now() + ext;
        }

        function mimeForAudioName(name, fallbackType) {
            const ext = (String(name || '').toLowerCase().match(/\.(wav|mp3|m4a|ogg|webm|mp4)$/) || [])[1];
            const map = {
                wav: 'audio/wav',
                mp3: 'audio/mpeg',
                m4a: 'audio/mp4',
                ogg: 'audio/ogg',
                webm: 'audio/webm',
                mp4: 'audio/mp4'
            };
            if (fallbackType && fallbackType !== 'application/octet-stream') {
                return fallbackType;
            }
            return map[ext] || 'audio/mpeg';
        }

        async function toAsciiAudioFile(fileOrBlob, originalName) {
            const name = asciiAudioFilename(originalName || fileOrBlob.name || 'audio.mp3');
            const type = mimeForAudioName(name, fileOrBlob.type);
            const buffer = await fileOrBlob.arrayBuffer();
            if (!buffer || buffer.byteLength === 0) {
                throw new Error('读取音频文件失败，文件是空的');
            }
            if (buffer.byteLength > 50 * 1024 * 1024) {
                throw new Error('文件大小不能超过 50MB');
            }
            try {
                return new File([buffer], name, { type: type, lastModified: Date.now() });
            } catch (e) {
                return new Blob([buffer], { type: type });
            }
        }

        function shouldRecognizeText() {
            const el = document.getElementById('recognizeTextCheckbox');
            return !!(el && el.checked);
        }

        function appendUploadFields(formData) {
            formData.append('recognize_text', shouldRecognizeText() ? 'true' : 'false');
        }

        function formatUploadError(error) {
            const detail = error && error.detail;
            if (!detail) return '请重试';
            if (typeof detail === 'string') return detail;
            if (Array.isArray(detail)) {
                return detail.map((item) => item.msg || JSON.stringify(item)).join('；');
            }
            return '请重试';
        }

        function successUploadMessage(result) {
            if (result && result.transcript) {
                return '上传成功，文字已识别';
            }
            if (shouldRecognizeText()) {
                return '上传成功，音频可播放（未识别到文字）';
            }
            return '上传成功，音频可播放';
        }

        function recordingFilename() {
            let filename = 'recording';
            if (audioBlob.type.includes('wav')) {
                filename += '.wav';
            } else if (audioBlob.type.includes('webm')) {
                filename += '.webm';
            } else if (audioBlob.type.includes('mp4') || audioBlob.type.includes('m4a') || audioBlob.type.includes('aac')) {
                filename += '.m4a';
            } else {
                filename += '.webm';
            }
            return filename;
        }

        async function postSelfTalk(formData, statusId) {
            const recognize = shouldRecognizeText();
            showStatus(statusId, recognize ? '正在上传并识别文字，请稍候…' : '正在上传音频…', 'info');

            const token = localStorage.getItem('authToken');
            const response = await fetch('/api/self_talks/', {
                method: 'POST',
                body: formData,
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const result = await response.json();
                showStatus(statusId, successUploadMessage(result), 'success');
                loadHistory();
                return true;
            }
            if (response.status === 401) {
                alert('登录已过期，请重新登录');
                localStorage.removeItem('authToken');
                window.location.href = '/static/index.html';
                return false;
            }
            const error = await response.json().catch(() => ({ detail: '未知错误' }));
            const message = `上传失败: ${formatUploadError(error)}`;
            showStatus(statusId, message, 'error');
            alert(message);
            return false;
        }

        // 上传录音
        async function uploadRecording() {
            if (!checkAuthToken()) {
                redirectToLogin('请先登录');
                return;
            }

            if (!audioBlob) {
                showStatus('recordingStatus', '没有录音数据', 'error');
                return;
            }

            try {
                const uploadFile = await toAsciiAudioFile(audioBlob, recordingFilename());
                const formData = new FormData();
                formData.append('file', uploadFile, uploadFile.name || asciiAudioFilename(recordingFilename()));
                appendUploadFields(formData);
                await postSelfTalk(formData, 'recordingStatus');
            } catch (error) {
                console.error('上传失败:', error);
                const message = (error && error.message) ? error.message : '上传失败，请检查网络连接后重试';
                showStatus('recordingStatus', message, 'error');
                alert(message);
            }
        }

        // 上传音频文件
        async function uploadAudio() {
            if (!checkAuthToken()) {
                redirectToLogin('请先登录');
                return;
            }

            const fileInput = document.getElementById('audioFile');
            const file = fileInput.files[0];
            const uploadButton = document.getElementById('uploadButton');
            
            if (!file) {
                showStatus('uploadStatus', '请选择音频文件', 'error');
                return;
            }

            try {
                if (uploadButton) uploadButton.disabled = true;
                const uploadFile = await toAsciiAudioFile(file, file.name || 'audio.mp3');
                const formData = new FormData();
                formData.append('file', uploadFile, uploadFile.name || asciiAudioFilename(file.name || 'audio.mp3'));
                appendUploadFields(formData);
                const ok = await postSelfTalk(formData, 'uploadStatus');
                if (ok) {
                    fileInput.value = '';
                }
            } catch (error) {
                console.error('上传失败:', error);
                const message = (error && error.message) ? error.message : '上传失败，请检查网络连接后重试';
                showStatus('uploadStatus', message, 'error');
                alert(message);
            } finally {
                if (uploadButton) uploadButton.disabled = false;
            }
        }

        // 显示状态信息
        function showStatus(elementId, message, type) {
            const statusElement = document.getElementById(elementId);
            statusElement.textContent = message;
            statusElement.className = `status ${type}`;
            statusElement.style.display = 'block';
            
            // 3秒后自动隐藏成功信息
            if (type === 'success') {
                setTimeout(() => {
                    statusElement.style.display = 'none';
                }, 3000);
            }
        }

        // 加载历史记录
        async function loadHistory() {
            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch('/api/self_talks/', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    const items = data.self_talks || [];
                    displayHistory(items.slice(0, 3), 'historyList', false);
                    displayHistory(items, 'allHistoryList', true);
                } else if (response.status === 401) {
                    console.warn('认证失败，跳转到登录页面');
                    alert('登录已过期，请重新登录');
                    localStorage.removeItem('authToken');
                    window.location.href = '/static/index.html';
                } else {
                    console.error('加载历史记录失败');
                    const msg = '<p style="text-align: center; color: #e53e3e;">加载历史记录失败，请刷新重试</p>';
                    document.getElementById('historyList').innerHTML = msg;
                    document.getElementById('allHistoryList').innerHTML = msg;
                }
            } catch (error) {
                console.error('加载历史记录失败:', error);
            }
        }

        // 显示历史记录（editable=false 为只读预览，避免重复 id）
        function displayHistory(selfTalks, containerId, editable = true) {
            const container = document.getElementById(containerId);
            
            if (!selfTalks || selfTalks.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #a0aec0;">暂无 Self-talk 记录</p>';
                return;
            }

            container.innerHTML = selfTalks.map(st => renderSelfTalkItem(st, editable)).join('');
            if (editable) {
                container.querySelectorAll('.transcript-editor').forEach(ta => {
                    ta.dataset.savedTranscript = ta.value;
                });
            }
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeForTextarea(text) {
            return escapeHtml(text);
        }

        function renderSelfTalkItem(selfTalk, editable = true) {
            const transcriptText = selfTalk.transcript || '';
            const header = `
                    <div class="self-talk-header">
                        <span class="self-talk-date">${new Date(selfTalk.created_at).toLocaleString('zh-CN')}</span>
                        <div class="self-talk-actions">
                            <button type="button" class="action-button play-button" onclick="playAudio(${selfTalk.id})">
                                ▶️ 播放
                            </button>
                            <button type="button" class="action-button delete-button" onclick="deleteSelfTalk(${selfTalk.id})">
                                🗑️ 删除
                            </button>
                        </div>
                    </div>
            `;

            if (!editable) {
                const preview = transcriptText
                    ? escapeHtml(transcriptText.length > 120 ? transcriptText.slice(0, 120) + '…' : transcriptText)
                    : '<span class="no-transcript">暂无转写文字</span>';
                return `
                <div class="self-talk-item" data-id="${selfTalk.id}">
                    ${header}
                    <div class="transcript-block">
                        <div class="transcript-preview">${preview}</div>
                        <p class="edit-hint">↓ 在下方「所有 Self-talk 记录」中点击文本框编辑并保存</p>
                    </div>
                </div>
            `;
            }

            const placeholderAttr = transcriptText
                ? ''
                : 'placeholder="在此修改识别文字、添加标点符号"';
            return `
                <div class="self-talk-item self-talk-item-editable" data-id="${selfTalk.id}">
                    ${header}
                    <div class="transcript-block">
                        <div class="transcript-label">转写文字（点击输入框直接修改，改完点保存）</div>
                        <textarea
                            class="transcript-editor"
                            rows="4"
                            onblur="saveTranscriptOnBlur(this)"
                            ${placeholderAttr}
                        >${escapeForTextarea(transcriptText)}</textarea>
                        <div class="transcript-sync-status" data-sync-status></div>
                        <div class="transcript-actions">
                            <button
                                type="button"
                                class="action-button save-transcript-button"
                                onclick="saveTranscript(this)"
                            >
                                💾 保存到服务器
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function setSyncStatus(item, message, type = 'ok') {
            const el = item.querySelector('[data-sync-status]');
            if (!el) return;
            el.textContent = message;
            el.className = 'transcript-sync-status' + (type === 'pending' ? ' pending' : type === 'error' ? ' error' : '');
        }

        function formatServerTime(isoString) {
            if (!isoString) return '';
            try {
                return new Date(isoString).toLocaleString('zh-CN');
            } catch {
                return '';
            }
        }

        function applySavedTranscript(item, data) {
            const textarea = item.querySelector('.transcript-editor');
            if (textarea && data.transcript != null) {
                textarea.value = data.transcript;
                textarea.dataset.savedTranscript = data.transcript;
            }
            const when = formatServerTime(data.updated_at || data.created_at);
            setSyncStatus(item, when ? `✓ 已同步到服务器（${when}）` : '✓ 已同步到服务器');
        }

        async function saveTranscriptOnBlur(textarea) {
            const item = textarea.closest('.self-talk-item');
            if (!item || !item.classList.contains('self-talk-item-editable')) return;

            const current = textarea.value.trim();
            const saved = (textarea.dataset.savedTranscript || '').trim();
            if (current === saved) return;
            if (!current) return;

            await persistTranscript(item, textarea, null);
        }

        async function saveTranscript(saveBtn) {
            const item = saveBtn.closest('.self-talk-item');
            const textarea = item ? item.querySelector('.transcript-editor') : null;
            if (!item || !textarea) {
                alert('请在下方的「所有 Self-talk 记录」区域编辑并保存');
                return;
            }
            await persistTranscript(item, textarea, saveBtn);
        }

        async function persistTranscript(item, textarea, saveBtn) {
            if (!checkAuthToken()) {
                return;
            }

            const selfTalkId = item.dataset.id;
            const transcript = textarea.value.trim();

            if (!transcript) {
                alert('转写文字不能为空');
                return;
            }

            const originalLabel = saveBtn ? saveBtn.textContent : '';
            if (saveBtn) {
                saveBtn.disabled = true;
                saveBtn.textContent = '保存中...';
            }
            setSyncStatus(item, '正在保存到服务器…', 'pending');

            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch(`/api/self_talks/${selfTalkId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ transcript })
                });

                if (response.ok) {
                    const data = await response.json();
                    applySavedTranscript(item, data);
                    showStatus('recordingStatus', '转写文字已保存到数据库', 'success');
                    // 同步刷新上方预览区
                    loadHistory();
                } else if (response.status === 401) {
                    setSyncStatus(item, '保存失败：请重新登录', 'error');
                    alert('登录已过期，请重新登录');
                    localStorage.removeItem('authToken');
                    window.location.href = '/static/index.html';
                } else if (response.status === 404 || response.status === 405) {
                    setSyncStatus(item, '保存失败：后端接口未就绪', 'error');
                    alert('保存失败：请重启后端后再试（需要 PATCH /api/self_talks/{id}）');
                } else {
                    const errorData = await response.json().catch(() => ({ detail: '保存失败' }));
                    setSyncStatus(item, `保存失败：${errorData.detail || '请重试'}`, 'error');
                    alert(`保存失败: ${errorData.detail || '请重试'}`);
                }
            } catch (error) {
                console.error('保存转写失败:', error);
                setSyncStatus(item, '保存失败：网络错误', 'error');
                alert('保存失败，请检查网络连接后重试');
            } finally {
                if (saveBtn) {
                    saveBtn.disabled = false;
                    saveBtn.textContent = originalLabel;
                }
            }
        }

        // 检查认证令牌是否有效
        function checkAuthToken() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                return false;
            }
            const expiresAt = parseInt(localStorage.getItem('authTokenExpiresAt') || '0', 10);
            if (expiresAt && Date.now() >= expiresAt) {
                localStorage.removeItem('authToken');
                localStorage.removeItem('authTokenExpiresAt');
                return false;
            }
            return true;
        }

        function redirectToLogin(message) {
            if (message) alert(message);
            window.location.href = '/static/index.html';
        }

        // 删除 Self-talk
        async function deleteSelfTalk(id) {
            // 首先检查认证令牌
            if (!checkAuthToken()) {
                return;
            }

            if (!confirm('确定要删除这条 Self-talk 记录吗？')) {
                return;
            }

            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch(`/api/self_talks/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    showStatus('recordingStatus', '删除成功！', 'success');
                    loadHistory(); // 刷新历史记录
                } else if (response.status === 401) {
                    // 处理认证失败
                    alert('登录已过期，请重新登录');
                    localStorage.removeItem('authToken');
                    window.location.href = '/static/index.html';
                } else {
                    const errorData = await response.json().catch(() => ({ detail: '未知错误' }));
                    alert(`删除失败: ${errorData.detail || '请重试'}`);
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败，请检查网络连接后重试');
            }
        }

        // 页面加载时获取历史记录
        document.addEventListener('DOMContentLoaded', async function() {
            if (!checkAuthToken()) {
                redirectToLogin('请先登录');
                return;
            }
            try {
                const res = await fetch('/auth/me', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
                });
                if (!res.ok) {
                    if (res.status === 401) {
                        localStorage.removeItem('authToken');
                        redirectToLogin('登录已过期，请重新登录');
                    }
                    return;
                }
                loadHistory();
            } catch (e) {
                console.warn('认证检查失败，仍尝试加载本地数据', e);
                loadHistory();
            }
        });
    </script>

    <script src="/static/reminder_notification.js?v=121"></script>
