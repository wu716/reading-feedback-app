<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Self-talk - 读书反馈应用</title>
    <link rel="stylesheet" href="/static/css/self-talk-player.css?v=20260829mic1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --st-green: #07C160;
            --st-green-press: #06AD56;
            --st-red: #FA5151;
            --st-text: #191919;
            --st-sub: #888888;
            --st-line: #E5E5E5;
            --st-bg: #EDEDED;
            --st-card: #FFFFFF;
            --st-link: #576B95;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--st-bg);
            min-height: 100vh;
            color: var(--st-text);
        }

        .st-ico {
            width: 1.15em;
            height: 1.15em;
            display: block;
            flex-shrink: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
            color: var(--st-text);
            position: relative;
            padding-top: 8px;
        }

        .header h1 {
            font-size: 1.45rem;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--st-sub);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--st-card);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--st-line);
            box-shadow: none;
        }

        .card:hover {
            box-shadow: none;
        }

        .card h2 {
            color: var(--st-text);
            margin-bottom: 16px;
            font-size: 1.15rem;
            font-weight: 600;
        }

        .recording-section {
            text-align: center;
        }

        .record-button {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            border: none;
            background: var(--st-green);
            color: white;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease, opacity 0.15s ease;
            margin: 16px 0 8px;
            box-shadow: none;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .record-button .st-ico {
            width: 28px;
            height: 28px;
        }

        .record-button:hover {
            background: var(--st-green-press);
        }

        .record-button.recording {
            background: var(--st-red);
            animation: none;
        }

        .record-button.recording:hover {
            background: #e44545;
        }

        .record-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            background: #B2B2B2;
        }

        .recording-timer {
            display: none;
            margin: 4px 0 8px;
            font-size: 1.5rem;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: var(--st-red);
            letter-spacing: 0.04em;
        }

        .recording-timer.visible {
            display: block;
        }

        .recording-actions {
            display: none;
            justify-content: center;
            margin: 0 0 8px;
        }

        .recording-actions.visible {
            display: flex;
        }

        .cancel-record-button {
            min-height: 44px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #F7F7F7;
            color: var(--st-sub);
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .cancel-record-button:hover {
            background: #EFEFEF;
        }

        .recording-hint {
            margin: 8px 0 0;
            font-size: 0.85rem;
            color: #718096;
            line-height: 1.5;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .upload-section {
            margin-top: 20px;
        }

        .upload-section h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--st-text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .file-input {
            width: 100%;
            padding: 12px;
            border: 1px dashed var(--st-line);
            border-radius: 8px;
            background: #F7F7F7;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .file-input:hover {
            border-color: var(--st-green);
            background: #F7F7F7;
        }

        .upload-button {
            width: 100%;
            padding: 12px;
            background: var(--st-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .upload-button:hover {
            background: var(--st-green-press);
        }

        .upload-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .recognize-option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 8px 0 16px;
            padding: 12px 14px;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            user-select: none;
        }

        .recognize-option input {
            margin-top: 3px;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            accent-color: var(--st-green);
        }

        .recognize-option-title {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #2d3748;
        }

        .recognize-option-hint {
            display: block;
            margin-top: 4px;
            font-size: 0.8rem;
            font-weight: 400;
            color: #718096;
            line-height: 1.4;
        }

        .mic-help {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #FAFAFA;
            border: 1px solid var(--st-line);
            border-radius: 12px;
            text-align: left;
        }

        .mic-help.visible {
            display: block;
        }

        .mic-help-head {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .mic-help-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #F2F2F2;
            color: var(--st-text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .mic-help-icon .st-ico {
            width: 20px;
            height: 20px;
        }

        .mic-help-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--st-text);
            line-height: 1.4;
        }

        .mic-help-text {
            margin-top: 4px;
            font-size: 0.88rem;
            color: var(--st-sub);
            line-height: 1.5;
        }

        .mic-help-steps {
            display: none;
            margin-top: 10px;
            padding: 10px 12px;
            background: #fff;
            border-radius: 8px;
            font-size: 0.88rem;
            color: var(--st-text);
            font-weight: 500;
            line-height: 1.5;
        }

        .mic-help-steps.visible {
            display: block;
        }

        .mic-help-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .mic-help-primary {
            flex: 1;
            min-height: 44px;
            border: none;
            border-radius: 8px;
            background: var(--st-green);
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
        }

        .mic-help-primary:hover {
            background: var(--st-green-press);
        }

        .mic-help-cancel {
            min-height: 44px;
            min-width: 72px;
            padding: 0 16px;
            border: none;
            border-radius: 8px;
            background: #F2F2F2;
            color: var(--st-sub);
            font-size: 1rem;
            cursor: pointer;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .history-section {
            grid-column: 1 / -1;
        }

        .self-talk-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--st-line);
            box-shadow: none;
        }

        .self-talk-item:hover {
            box-shadow: none;
        }

        .self-talk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .self-talk-date {
            color: #718096;
            font-size: 0.9rem;
        }

        .self-talk-actions {
            display: flex;
            gap: 10px;
        }

        .action-button {
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: transparent;
        }

        .action-button .st-ico {
            width: 16px;
            height: 16px;
        }

        .play-button {
            background: transparent;
            color: var(--st-green);
            border: 1px solid var(--st-green);
        }

        .play-button:hover {
            background: #F0FFF6;
        }

        .delete-button {
            background: transparent;
            color: var(--st-sub);
            border: 1px solid var(--st-line);
        }

        .delete-button:hover {
            color: var(--st-red);
            border-color: #F0C0C0;
        }

        .transcript-block {
            margin-top: 15px;
        }

        .transcript-label {
            font-size: 0.85rem;
            color: #718096;
            margin-bottom: 6px;
        }

        .transcript-preview {
            background: #f7fafc;
            padding: 12px 14px;
            border-radius: 8px;
            line-height: 1.6;
            color: #4a5568;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .edit-hint {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #a0aec0;
        }

        .transcript-editor {
            width: 100%;
            min-height: 88px;
            padding: 12px 14px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            background: #fff;
            line-height: 1.6;
            color: #2d3748;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            cursor: text;
        }

        .transcript-editor:focus {
            outline: none;
            border-color: var(--st-green);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(7, 193, 96, 0.15);
        }

        .transcript-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }

        .save-transcript-button {
            background: var(--st-green);
            color: white;
            border: none;
        }

        .save-transcript-button:hover {
            background: var(--st-green-press);
        }

        .save-transcript-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .transcript-sync-status {
            margin-top: 6px;
            font-size: 0.8rem;
            color: #48bb78;
            min-height: 1.2em;
        }

        .transcript-sync-status.pending {
            color: #718096;
        }

        .transcript-sync-status.error {
            color: #e53e3e;
        }

        .no-transcript {
            color: #a0aec0;
            font-style: italic;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--st-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .st-topbar {
            position: sticky;
            top: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 8px;
            padding-top: max(8px, env(safe-area-inset-top, 8px));
            margin: 0 -20px 16px;
            background: #fff;
            border-bottom: 1px solid var(--st-line);
        }

        .back-button,
        .settings-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 44px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 1rem;
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            pointer-events: auto;
            border: none;
        }

        .back-button .st-ico,
        .settings-button .st-ico {
            width: 20px;
            height: 20px;
        }

        .back-button {
            background: transparent;
            color: var(--st-text);
            z-index: 10001;
        }

        .back-button:hover,
        .back-button:active {
            background: #F7F7F7;
        }

        .settings-button {
            background: transparent;
            color: var(--st-link);
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .container {
                padding: 0 15px 15px;
            }

            .st-topbar {
                margin: 0 -15px 16px;
            }

            .settings-button {
                padding: 8px 12px;
                font-size: 0.9rem;
            }
        }

        html.embed-mode .st-topbar {
            display: none;
        }

        html.embed-mode .header {
            padding-top: 8px;
            margin-bottom: 20px;
        }

        html.embed-mode body {
            min-height: 100%;
            background: var(--st-bg);
        }
    </style>
    <link rel="stylesheet" href="/static/css/app-tabbar.css?v=20260825todo1">
</head>
<body>
    <script>
        if (new URLSearchParams(location.search).get('embed') === '1') {
            document.documentElement.classList.add('embed-mode');
        }
    </script>
    <div class="container">
        <div class="st-topbar">
            <a href="/static/index.html" class="back-button" id="selfTalkBackBtn">
                <svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
                <span>返回</span>
            </a>
            <a href="/static/index.html#user-center" class="settings-button">提醒设置</a>
        </div>
        <div class="header">
            <h1>Self-talk</h1>
            <p>记录你的内心对话</p>
        </div>

        <div class="main-content">
            <!-- 录音区域 -->
            <div class="card recording-section">
                <h2>开始录音</h2>
                <button id="recordButton" class="record-button" type="button" onclick="toggleRecording()">
                    <svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21M9 21h6"/></svg>
                    <span>开始录音</span>
                </button>
                <div id="recordingTimer" class="recording-timer" aria-live="polite">00:00</div>
                <div id="recordingActions" class="recording-actions">
                    <button type="button" id="cancelRecordButton" class="cancel-record-button" onclick="cancelRecording()">
                        <svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                        <span>取消</span>
                    </button>
                </div>
                <p id="recordingHint" class="recording-hint"></p>
                <div id="recordingStatus" class="status" style="display: none;"></div>
                <div id="micHelpBanner" class="mic-help" hidden>
                    <div class="mic-help-head">
                        <div class="mic-help-icon" id="micHelpIcon" aria-hidden="true"></div>
                        <div>
                            <p class="mic-help-title" id="micHelpTitle"></p>
                            <p class="mic-help-text" id="micHelpText"></p>
                        </div>
                    </div>
                    <p class="mic-help-steps" id="micHelpSteps"></p>
                    <div class="mic-help-actions">
                        <button type="button" class="mic-help-primary" id="micHelpPrimary"></button>
                        <button type="button" class="mic-help-cancel" id="micHelpCancel">取消</button>
                    </div>
                </div>
                
                <div class="upload-section">
                    <h3>
                        <svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5"/><path d="M8 9l4-4 4 4"/><path d="M5 19h14"/></svg>
                        或上传音频文件
                    </h3>
                    <label class="recognize-option" for="recognizeTextCheckbox">
                        <input type="checkbox" id="recognizeTextCheckbox">
                        <span>
                            <span class="recognize-option-title">识别文字</span>
                            <span class="recognize-option-hint">勾选后会把语音转成文字，可能需要更长时间。不勾选则只保存音频，上传后即可播放。</span>
                        </span>
                    </label>
                    <input type="file" id="audioFile" class="file-input" accept="audio/*,.m4a,.mp3,.wav,.ogg,.webm,.mp4">
                    <button id="uploadButton" class="upload-button" onclick="uploadAudio()">
                        <svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5"/><path d="M8 9l4-4 4 4"/><path d="M5 19h14"/></svg>
                        <span>上传音频</span>
                    </button>
                    <div id="uploadStatus" class="status" style="display: none;"></div>
                </div>
            </div>

            <!-- 历史记录区域 -->
            <div class="card">
                <h2>历史记录</h2>
                <div id="historyList">
                    <div class="loading"></div>
                    <p style="text-align: center; margin-top: 10px;">加载中...</p>
                </div>
            </div>
        </div>

        <!-- 历史记录详情 -->
        <div class="card history-section">
            <h2>所有 Self-talk 记录</h2>
            <div id="allHistoryList">
                <div class="loading"></div>
                <p style="text-align: center; margin-top: 10px;">加载中...</p>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let audioBlob = null;
        let discardRecording = false;
        let nativeStopHandled = false;
        let pendingNativeStart = false;
        let pendingSettingsReturn = false;
        let micHelpKind = null;
        let recordingTimerId = null;
        let recordingStartedAt = 0;
        let nativeRecordingFilename = 'recording.m4a';

        const ST_ICON = {
            mic: '<svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21M9 21h6"/></svg>',
            stop: '<svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>',
            play: '<svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6.2v11.6L18.5 12 8 6.2z"/></svg>',
            upload: '<svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5"/><path d="M8 9l4-4 4 4"/><path d="M5 19h14"/></svg>',
            trash: '<svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>',
            save: '<svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg>',
            close: '<svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
            micOff: '<svg class="st-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 8.2 6.3"/><path d="M12 17.5V21M9 21h6"/><path d="M4 4l16 16"/></svg>'
        };

        function nativeBridge() {
            try {
                if (window.ShuranNative && typeof window.ShuranNative.startRecording === 'function') {
                    return window.ShuranNative;
                }
            } catch (e) {}
            try {
                if (window.parent && window.parent !== window
                    && window.parent.ShuranNative
                    && typeof window.parent.ShuranNative.startRecording === 'function') {
                    return window.parent.ShuranNative;
                }
            } catch (e) {}
            return null;
        }

        function hasNativeRecorder() {
            return !!nativeBridge();
        }

        function installNativeCallbacks() {
            const assign = (target) => {
                if (!target) return;
                try {
                    target.onNativeAudioPermission = window.onNativeAudioPermission;
                    target.onNativeAppResume = window.onNativeAppResume;
                    target.onNativeRecordingStopped = window.onNativeRecordingStopped;
                } catch (e) {}
            };
            assign(window);
            try {
                if (window.parent && window.parent !== window) assign(window.parent);
            } catch (e) {}
        }

        function canBrowserRecord() {
            return !!(window.isSecureContext
                && navigator.mediaDevices
                && navigator.mediaDevices.getUserMedia);
        }

        function parseNativeJson(raw) {
            if (raw && typeof raw === 'object') return raw;
            try {
                return JSON.parse(String(raw || '{}'));
            } catch (e) {
                return { ok: false, message: String(raw || '未知错误') };
            }
        }

        function setRecordButtonLabel(active, disabledLabel) {

        function setRecordingUi(active) {

            const timer = document.getElementById('recordingTimer');

        function hideMicHelp() {

        function showMicHelp(kind, customMessage) {
            const copy = {

                },

                },

                },

        function handleMicHelpPrimary() {
            if (micHelpKind === 'ask') {
                pendingNativeStart = true;
                if (hasNativeRecorder()) {
                    nativeBridge().requestAudioPermission();
                } else {
                    startBrowserRecording();
                }
                return;
            }
            if (micHelpKind === 'settings' || micHelpKind === 'blocked') {
                const native = nativeBridge();
                if (native && typeof native.openAppSettings === 'function') {
                    pendingSettingsReturn = true;
                    pendingNativeStart = true;
                    native.openAppSettings();
                    return;
                }
                showMicHelp('browser');
                return;
            }
            if (micHelpKind === 'busy' || micHelpKind === 'generic' || micHelpKind === 'browser') {
                hideMicHelp();
                startRecording();
            }
        }

        function bindMicHelpUi() {
            const primary = document.getElementById('micHelpPrimary');
            const cancel = document.getElementById('micHelpCancel');
            if (primary) primary.addEventListener('click', handleMicHelpPrimary);
            if (cancel) cancel.addEventListener('click', hideMicHelp);
        }

        function showRecordFail(code, message) {
            if (code === 'busy' || code === 'idle') {
                return;
            }
            if (code === 'need_permission') {
                showMicHelp('ask');
                return;
            }
            if (code === 'mic_busy') {
                showMicHelp('busy');
                return;
            }
            if (code === 'blocked') {
                showMicHelp('blocked');
                return;
            }
            showMicHelp('generic', message);
        }

        function startRecordingTimer() {
            stopRecordingTimer();
            recordingStartedAt = Date.now();
            updateRecordingTimer();
            recordingTimerId = setInterval(updateRecordingTimer, 250);
        }

        function stopRecordingTimer() {
            if (recordingTimerId) {
                clearInterval(recordingTimerId);
                recordingTimerId = null;
            }
        }

        function updateRecordingTimer() {
            const timer = document.getElementById('recordingTimer');
            if (!timer) return;
            const sec = Math.max(0, Math.floor((Date.now() - recordingStartedAt) / 1000));
            const mm = String(Math.floor(sec / 60)).padStart(2, '0');
            const ss = String(sec % 60).padStart(2, '0');
            timer.textContent = mm + ':' + ss;
        }

        function setupRecorderUi() {
            const button = document.getElementById('recordButton');
            const hint = document.getElementById('recordingHint');
            if (!button) return;
            if (hasNativeRecorder()) {
                button.disabled = false;
                setRecordButtonLabel(false);
                if (hint) hint.textContent = '点绿色按钮开始，停录后会自动保存。';
                return;
            }
            if (canBrowserRecord()) {
                button.disabled = false;
                setRecordButtonLabel(false);
                if (hint) hint.textContent = '';
                return;
            }
            button.disabled = true;
            setRecordButtonLabel(false, '无法在线录音');
            if (hint) {
                hint.textContent = '当前网页不是安全连接，没法在线录音。请用下方上传，或打开书然 App 录音。';
            }
        }

        function homeUrl() {
            return (window.location.origin || '') + '/static/index.html';
        }

        function goBack(event) {
            if (event) {
                event.preventDefault();
            }
            window.location.href = homeUrl();
            return false;
        }

        function goToReminderSettings() {
            window.location.href = homeUrl() + '#user-center';
        }

        window.handleAppBack = function () {
            if (isRecording || pendingNativeStart) {
                cancelRecording();
                return 'consumed';
            }
            if (micHelpKind) {
                hideMicHelp();
                return 'consumed';
            }
            goBack();
            return 'consumed';
        };

        document.addEventListener('click', function (event) {
            const backBtn = event.target.closest('#selfTalkBackBtn');
            if (!backBtn) return;
            goBack(event);
        }, true);

        // 切换录音状态
        async function toggleRecording() {
            if (!isRecording) {
                await startRecording();
            } else {
                stopRecording();
            }
        }

        async function startRecording() {
            if (hasNativeRecorder()) {
                await startNativeRecording();
                return;
            }
            if (!canBrowserRecord()) {
                showMicHelp('generic', '当前网页没法在线录音。请用下方上传，或打开书然 App。');
                return;
            }
            await startBrowserRecording();
        }

        async function startNativeRecording() {
            if (isRecording) return;
            const native = nativeBridge();
            if (!native) return;
            try {
                if (typeof native.hasAudioPermission === 'function' && !native.hasAudioPermission()) {
                    const canAsk = typeof native.canAskAudioPermissionAgain !== 'function'
                        || native.canAskAudioPermissionAgain();
                    if (!canAsk) {
                        showMicHelp('settings');
                        return;
                    }
                    pendingNativeStart = true;
                    showStatus('recordingStatus', '请在弹出的窗口点「允许」', 'info');
                    native.requestAudioPermission();
                    return;
                }
                const result = parseNativeJson(native.startRecording());
                if (!result.ok && result.code === 'need_permission') {
                    pendingNativeStart = true;
                    showStatus('recordingStatus', '请在弹出的窗口点「允许」', 'info');
                    native.requestAudioPermission();
                    return;
                }
                if (!result.ok) {
                    showRecordFail(result.code, result.message);
                    return;
                }
                nativeStopHandled = false;
                isRecording = true;
                setRecordingUi(true);
                showStatus('recordingStatus', '正在录音…', 'info');
            } catch (error) {
                console.error('原生录音失败:', error);
                showRecordFail('generic', '现在没法录音，请再试一次');
            }
        }

        window.onNativeAudioPermission = function (info) {
            const granted = !!(info && info.granted);
            const canAskAgain = !info || info.canAskAgain !== false;
            if (granted) {
                hideMicHelp();
                if (pendingNativeStart) {
                    pendingNativeStart = false;
                    startNativeRecording();
                }
                return;
            }
            pendingNativeStart = false;
            isRecording = false;
            setRecordingUi(false);
            if (canAskAgain) {
                showMicHelp('ask');
                return;
            }
            showMicHelp('settings');
        };

        window.onNativeAppResume = function (info) {
            const granted = !!(info && info.granted);
            if (granted) {
                const shouldStart = pendingNativeStart || pendingSettingsReturn
                    || micHelpKind === 'settings' || micHelpKind === 'blocked' || micHelpKind === 'ask';
                hideMicHelp();
                pendingSettingsReturn = false;
                if (shouldStart && !isRecording) {
                    pendingNativeStart = false;
                    startNativeRecording();
                }
                return;
            }
            if (pendingSettingsReturn) {
                showMicHelp('settings');
            }
        };

        window.onNativeRecordingStopped = function (info) {
            if (nativeStopHandled) return;
            nativeStopHandled = true;
            handleNativeStopResult(info);
        };

        installNativeCallbacks();

        async function handleNativeStopResult(info) {
            const result = parseNativeJson(info);
            isRecording = false;
            setRecordingUi(false);
            if (!result.ok) {
                showRecordFail(result.code, result.message || '录音失败');
                return;
            }
            nativeRecordingFilename = result.filename || 'recording.m4a';
            showStatus('recordingStatus', '录音完成，正在上传…', 'info');
            const button = document.getElementById('recordButton');
            if (button) button.disabled = true;
            try {
                const type = result.mimeType || 'audio/mp4';
                audioBlob = await readNativeRecordingBlob(result.url, type);
                await uploadRecording();
            } catch (error) {
                console.error('读取原生录音失败:', error);
                showStatus('recordingStatus', (error && error.message) || '刚才的录音没读到，请再录一次', 'error');
            } finally {
                if (button && hasNativeRecorder()) button.disabled = false;
            }
        }

        function base64ToBlob(b64, mimeType) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return new Blob([bytes], { type: mimeType || 'audio/mp4' });
        }

        async function readNativeRecordingBlob(url, mimeType) {
            try {
                const resp = await fetch((url || '/__shuran_native_recording') + '?t=' + Date.now());
                if (resp.ok) {
                    const blob = await resp.blob();
                    if (blob && blob.size > 0) {
                        return blob.type === mimeType ? blob : new Blob([blob], { type: mimeType });
                    }
                }
            } catch (e) {
                console.warn('拦截读取录音失败，改用桥接', e);
            }
            const native = nativeBridge();
            if (native && typeof native.readRecordingBase64 === 'function') {
                const b64 = native.readRecordingBase64();
                if (b64) return base64ToBlob(b64, mimeType);
            }
            throw new Error('刚才的录音没读到，请再录一次');
        }

        async function startBrowserRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });

                let mimeType = 'audio/wav';
                if (!MediaRecorder.isTypeSupported('audio/wav')) {
                    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                        mimeType = 'audio/webm;codecs=opus';
                    } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                        mimeType = 'audio/webm';
                    } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
                        mimeType = 'audio/mp4';
                    } else {
                        mimeType = 'audio/webm';
                    }
                }

                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: mimeType
                });
                audioChunks = [];
                discardRecording = false;

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    if (discardRecording) {
                        discardRecording = false;
                        audioChunks = [];
                        audioBlob = null;
                        showStatus('recordingStatus', '已取消录音', 'info');
                        return;
                    }
                    audioBlob = new Blob(audioChunks, { type: mimeType });
                    showStatus('recordingStatus', '录音完成，正在上传…', 'info');
                    uploadRecording();
                };

                mediaRecorder.start();
                isRecording = true;
                setRecordingUi(true);
                showStatus('recordingStatus', '正在录音…', 'info');
            } catch (error) {
                console.error('录音失败:', error);
                const name = (error && error.name) || '';
                if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
                    showMicHelp(hasNativeRecorder() ? 'ask' : 'browser');
                    return;
                }
                if (name === 'NotReadableError' || name === 'AbortError') {
                    showMicHelp('busy');
                    return;
                }
                if (name === 'NotFoundError') {
                    showMicHelp('generic', '找不到麦克风。请检查设备后再试，或改用下方上传。');
                    return;
                }
                showMicHelp('generic', '现在没法录音，请再试一次，或改用下方上传。');
            }
        }

        function stopRecording() {
            const native = nativeBridge();
            if (native && isRecording) {
                try {
                    const result = parseNativeJson(native.stopRecording());
                    nativeStopHandled = true;
                    handleNativeStopResult(result);
                } catch (error) {
                    console.error('停止原生录音失败:', error);
                    isRecording = false;
                    setRecordingUi(false);
                    showStatus('recordingStatus', '停止失败，请再试一次', 'error');
                }
                return;
            }
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                setRecordingUi(false);
            }
        }

        function cancelRecording() {
            hideMicHelp();
            pendingSettingsReturn = false;
            const native = nativeBridge();
            if (native && (isRecording || pendingNativeStart)) {
                pendingNativeStart = false;
                nativeStopHandled = true;
                try {
                    native.cancelRecording();
                } catch (e) {}
                isRecording = false;
                audioBlob = null;
                setRecordingUi(false);
                showStatus('recordingStatus', '已取消录音', 'info');
                return;
            }
            if (mediaRecorder && isRecording) {
                discardRecording = true;
                stopRecording();
            }
        }

        function asciiAudioFilename(name) {
            const raw = String(name || 'audio.mp3');
            const match = raw.toLowerCase().match(/\.(wav|mp3|m4a|ogg|webm|mp4)$/);
            const ext = match ? match[0] : '.mp3';
            return 'selftalk_' + Date.now() + ext;
        }

        function mimeForAudioName(name, fallbackType) {
            const ext = (String(name || '').toLowerCase().match(/\.(wav|mp3|m4a|ogg|webm|mp4)$/) || [])[1];
            const map = {
                wav: 'audio/wav',
                mp3: 'audio/mpeg',
                m4a: 'audio/mp4',
                ogg: 'audio/ogg',
                webm: 'audio/webm',
                mp4: 'audio/mp4'
            };
            if (fallbackType && fallbackType !== 'application/octet-stream') {
                return fallbackType;
            }
            return map[ext] || 'audio/mpeg';
        }

        async function toAsciiAudioFile(fileOrBlob, originalName) {
            const name = asciiAudioFilename(originalName || fileOrBlob.name || 'audio.mp3');
            const type = mimeForAudioName(name, fileOrBlob.type);
            const buffer = await fileOrBlob.arrayBuffer();
            if (!buffer || buffer.byteLength === 0) {
                throw new Error('读取音频文件失败，文件是空的');
            }
            if (buffer.byteLength > 50 * 1024 * 1024) {
                throw new Error('文件大小不能超过 50MB');
            }
            try {
                return new File([buffer], name, { type: type, lastModified: Date.now() });
            } catch (e) {
                return new Blob([buffer], { type: type });
            }
        }

        function shouldRecognizeText() {
            const el = document.getElementById('recognizeTextCheckbox');
            return !!(el && el.checked);
        }

        function appendUploadFields(formData) {
            formData.append('recognize_text', shouldRecognizeText() ? 'true' : 'false');
        }

        function formatUploadError(error) {
            const detail = error && error.detail;
            if (!detail) return '请重试';
            if (typeof detail === 'string') return detail;
            if (Array.isArray(detail)) {
                return detail.map((item) => item.msg || JSON.stringify(item)).join('；');
            }
            return '请重试';
        }

        function successUploadMessage(result) {
            if (result && result.transcript) {
                return '上传成功，文字已识别';
            }
            if (shouldRecognizeText()) {
                return '上传成功，音频可播放（未识别到文字）';
            }
            return '上传成功，音频可播放';
        }

        function recordingFilename() {
            const type = (audioBlob && audioBlob.type) || '';
            if (type.includes('wav')) return 'recording.wav';
            if (type.includes('webm')) return 'recording.webm';
            if (type.includes('mpeg') || type.includes('mp3')) return 'recording.mp3';
            if (type.includes('ogg')) return 'recording.ogg';
            if (type.includes('mp4') || type.includes('m4a') || type.includes('aac')) {
                return nativeRecordingFilename || 'recording.m4a';
            }
            return nativeRecordingFilename || 'recording.m4a';
        }

        async function postSelfTalk(formData, statusId) {
            const recognize = shouldRecognizeText();
            showStatus(statusId, recognize ? '正在上传并识别文字，请稍候…' : '正在上传音频…', 'info');

            const token = localStorage.getItem('authToken');
            const response = await fetch('/api/self_talks/', {
                method: 'POST',
                body: formData,
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const result = await response.json();
                showStatus(statusId, successUploadMessage(result), 'success');
                loadHistory();
                return true;
            }
            if (response.status === 401) {
                alert('登录已过期，请重新登录');
                localStorage.removeItem('authToken');
                window.location.href = '/static/index.html';
                return false;
            }
            const error = await response.json().catch(() => ({ detail: '未知错误' }));
            const message = `上传失败: ${formatUploadError(error)}`;
            showStatus(statusId, message, 'error');
            alert(message);
            return false;
        }

        // 上传录音
        async function uploadRecording() {
            if (!checkAuthToken()) {
                redirectToLogin('请先登录');
                return;
            }

            if (!audioBlob) {
                showStatus('recordingStatus', '没有录音数据', 'error');
                return;
            }

            try {
                const uploadFile = await toAsciiAudioFile(audioBlob, recordingFilename());
                const formData = new FormData();
                formData.append('file', uploadFile, uploadFile.name || asciiAudioFilename(recordingFilename()));
                appendUploadFields(formData);
                await postSelfTalk(formData, 'recordingStatus');
            } catch (error) {
                console.error('上传失败:', error);
                const message = (error && error.message) ? error.message : '上传失败，请检查网络连接后重试';
                showStatus('recordingStatus', message, 'error');
                alert(message);
            }
        }

        // 上传音频文件
        async function uploadAudio() {
            if (!checkAuthToken()) {
                redirectToLogin('请先登录');
                return;
            }

            const fileInput = document.getElementById('audioFile');
            const file = fileInput.files[0];
            const uploadButton = document.getElementById('uploadButton');
            
            if (!file) {
                showStatus('uploadStatus', '请选择音频文件', 'error');
                return;
            }

            try {
                if (uploadButton) uploadButton.disabled = true;
                const uploadFile = await toAsciiAudioFile(file, file.name || 'audio.mp3');
                const formData = new FormData();
                formData.append('file', uploadFile, uploadFile.name || asciiAudioFilename(file.name || 'audio.mp3'));
                appendUploadFields(formData);
                const ok = await postSelfTalk(formData, 'uploadStatus');
                if (ok) {
                    fileInput.value = '';
                }
            } catch (error) {
                console.error('上传失败:', error);
                const message = (error && error.message) ? error.message : '上传失败，请检查网络连接后重试';
                showStatus('uploadStatus', message, 'error');
                alert(message);
            } finally {
                if (uploadButton) uploadButton.disabled = false;
            }
        }

        // 显示状态信息
        function showStatus(elementId, message, type) {
            const statusElement = document.getElementById(elementId);
            statusElement.textContent = message;
            statusElement.className = `status ${type}`;
            statusElement.style.display = 'block';
            
            // 3秒后自动隐藏成功信息
            if (type === 'success') {
                setTimeout(() => {
                    statusElement.style.display = 'none';
                }, 3000);
            }
        }

        // 加载历史记录
        async function loadHistory() {
            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch('/api/self_talks/', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    const items = data.self_talks || [];
                    displayHistory(items.slice(0, 3), 'historyList', false);
                    displayHistory(items, 'allHistoryList', true);
                } else if (response.status === 401) {
                    console.warn('认证失败，跳转到登录页面');
                    alert('登录已过期，请重新登录');
                    localStorage.removeItem('authToken');
                    window.location.href = '/static/index.html';
                } else {
                    console.error('加载历史记录失败');
                    const msg = '<p style="text-align: center; color: #e53e3e;">加载历史记录失败，请刷新重试</p>';
                    document.getElementById('historyList').innerHTML = msg;
                    document.getElementById('allHistoryList').innerHTML = msg;
                }
            } catch (error) {
                console.error('加载历史记录失败:', error);
            }
        }

        // 显示历史记录（editable=false 为只读预览，避免重复 id）
        function displayHistory(selfTalks, containerId, editable = true) {
            const container = document.getElementById(containerId);
            
            if (!selfTalks || selfTalks.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #a0aec0;">暂无 Self-talk 记录</p>';
                return;
            }

            container.innerHTML = selfTalks.map(st => renderSelfTalkItem(st, editable)).join('');
            if (editable) {
                container.querySelectorAll('.transcript-editor').forEach(ta => {
                    ta.dataset.savedTranscript = ta.value;
                });
            }
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeForTextarea(text) {
            return escapeHtml(text);
        }

        function renderSelfTalkItem(selfTalk, editable = true) {
            const transcriptText = selfTalk.transcript || '';
            const header = `
                    <div class="self-talk-header">
                        <span class="self-talk-date">${new Date(selfTalk.created_at).toLocaleString('zh-CN')}</span>
                        <div class="self-talk-actions">
                            <button type="button" class="action-button play-button" onclick="playAudio(${selfTalk.id})">
                                ${ST_ICON.play}<span>播放</span>
                            </button>
                            <button type="button" class="action-button delete-button" onclick="deleteSelfTalk(${selfTalk.id})">
                                ${ST_ICON.trash}<span>删除</span>
                            </button>
                        </div>
                    </div>
            `;

            if (!editable) {
                const preview = transcriptText
                    ? escapeHtml(transcriptText.length > 120 ? transcriptText.slice(0, 120) + '…' : transcriptText)
                    : '<span class="no-transcript">暂无转写文字</span>';
                return `
                <div class="self-talk-item" data-id="${selfTalk.id}">
                    ${header}
                    <div class="transcript-block">
                        <div class="transcript-preview">${preview}</div>
                        <p class="edit-hint">↓ 在下方「所有 Self-talk 记录」中点击文本框编辑并保存</p>
                    </div>
                </div>
            `;
            }

            const placeholderAttr = transcriptText
                ? ''
                : 'placeholder="在此修改识别文字、添加标点符号"';
            return `
                <div class="self-talk-item self-talk-item-editable" data-id="${selfTalk.id}">
                    ${header}
                    <div class="transcript-block">
                        <div class="transcript-label">转写文字（点击输入框直接修改，改完点保存）</div>
                        <textarea
                            class="transcript-editor"
                            rows="4"
                            onblur="saveTranscriptOnBlur(this)"
                            ${placeholderAttr}
                        >${escapeForTextarea(transcriptText)}</textarea>
                        <div class="transcript-sync-status" data-sync-status></div>
                        <div class="transcript-actions">
                            <button
                                type="button"
                                class="action-button save-transcript-button"
                                onclick="saveTranscript(this)"
                            >
                                ${ST_ICON.save}<span>保存</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function setSyncStatus(item, message, type = 'ok') {
            const el = item.querySelector('[data-sync-status]');
            if (!el) return;
            el.textContent = message;
            el.className = 'transcript-sync-status' + (type === 'pending' ? ' pending' : type === 'error' ? ' error' : '');
        }

        function formatServerTime(isoString) {
            if (!isoString) return '';
            try {
                return new Date(isoString).toLocaleString('zh-CN');
            } catch {
                return '';
            }
        }

        function applySavedTranscript(item, data) {
            const textarea = item.querySelector('.transcript-editor');
            if (textarea && data.transcript != null) {
                textarea.value = data.transcript;
                textarea.dataset.savedTranscript = data.transcript;
            }
            const when = formatServerTime(data.updated_at || data.created_at);
            setSyncStatus(item, when ? `✓ 已同步到服务器（${when}）` : '✓ 已同步到服务器');
        }

        async function saveTranscriptOnBlur(textarea) {
            const item = textarea.closest('.self-talk-item');
            if (!item || !item.classList.contains('self-talk-item-editable')) return;

            const current = textarea.value.trim();
            const saved = (textarea.dataset.savedTranscript || '').trim();
            if (current === saved) return;
            if (!current) return;

            await persistTranscript(item, textarea, null);
        }

        async function saveTranscript(saveBtn) {
            const item = saveBtn.closest('.self-talk-item');
            const textarea = item ? item.querySelector('.transcript-editor') : null;
            if (!item || !textarea) {
                alert('请在下方的「所有 Self-talk 记录」区域编辑并保存');
                return;
            }
            await persistTranscript(item, textarea, saveBtn);
        }

        async function persistTranscript(item, textarea, saveBtn) {
            if (!checkAuthToken()) {
                return;
            }

            const selfTalkId = item.dataset.id;
            const transcript = textarea.value.trim();

            if (!transcript) {
                alert('转写文字不能为空');
                return;
            }

            const originalHtml = saveBtn ? saveBtn.innerHTML : '';
            if (saveBtn) {
                saveBtn.disabled = true;
                saveBtn.textContent = '保存中...';
            }
            setSyncStatus(item, '正在保存到服务器…', 'pending');

            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch(`/api/self_talks/${selfTalkId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ transcript })
                });

                if (response.ok) {
                    const data = await response.json();
                    applySavedTranscript(item, data);
                    showStatus('recordingStatus', '转写文字已保存到数据库', 'success');
                    // 同步刷新上方预览区
                    loadHistory();
                } else if (response.status === 401) {
                    setSyncStatus(item, '保存失败：请重新登录', 'error');
                    alert('登录已过期，请重新登录');
                    localStorage.removeItem('authToken');
                    window.location.href = '/static/index.html';
                } else if (response.status === 404 || response.status === 405) {
                    setSyncStatus(item, '保存失败：后端接口未就绪', 'error');
                    alert('保存失败：请重启后端后再试（需要 PATCH /api/self_talks/{id}）');
                } else {
                    const errorData = await response.json().catch(() => ({ detail: '保存失败' }));
                    setSyncStatus(item, `保存失败：${errorData.detail || '请重试'}`, 'error');
                    alert(`保存失败: ${errorData.detail || '请重试'}`);
                }
            } catch (error) {
                console.error('保存转写失败:', error);
                setSyncStatus(item, '保存失败：网络错误', 'error');
                alert('保存失败，请检查网络连接后重试');
            } finally {
                if (saveBtn) {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = originalHtml;
                }
            }
        }

        // 检查认证令牌是否有效
        function checkAuthToken() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                return false;
            }
            const expiresAt = parseInt(localStorage.getItem('authTokenExpiresAt') || '0', 10);
            if (expiresAt && Date.now() >= expiresAt) {
                localStorage.removeItem('authToken');
                localStorage.removeItem('authTokenExpiresAt');
                return false;
            }
            return true;
        }

        function redirectToLogin(message) {
            if (message) alert(message);
            window.location.href = '/static/index.html';
        }

        // 删除 Self-talk
        async function deleteSelfTalk(id) {
            // 首先检查认证令牌
            if (!checkAuthToken()) {
                return;
            }

            if (!confirm('确定要删除这条 Self-talk 记录吗？')) {
                return;
            }

            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch(`/api/self_talks/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    showStatus('recordingStatus', '删除成功！', 'success');
                    loadHistory(); // 刷新历史记录
                } else if (response.status === 401) {
                    // 处理认证失败
                    alert('登录已过期，请重新登录');
                    localStorage.removeItem('authToken');
                    window.location.href = '/static/index.html';
                } else {
                    const errorData = await response.json().catch(() => ({ detail: '未知错误' }));
                    alert(`删除失败: ${errorData.detail || '请重试'}`);
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败，请检查网络连接后重试');
            }
        }

        // 页面加载时获取历史记录
        document.addEventListener('DOMContentLoaded', async function() {
            bindMicHelpUi();
            setupRecorderUi();
            if (!checkAuthToken()) {
                redirectToLogin('请先登录');
                return;
            }
            try {
                const res = await fetch('/auth/me', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
                });
                if (!res.ok) {
                    if (res.status === 401) {
                        localStorage.removeItem('authToken');
                        redirectToLogin('登录已过期，请重新登录');
                    }
                    return;
                }
                loadHistory();
            } catch (e) {
                console.warn('认证检查失败，仍尝试加载本地数据', e);
                loadHistory();
            }
        });
    </script>
