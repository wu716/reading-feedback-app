<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>书然 · 记</title>
    <link rel="icon" href="/static/icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/app-icon-192.png">
    <link rel="stylesheet" href="/static/css/schedule-log.css?v=20260917cap1">
    <style>
        html, body {
            margin: 0;
            background: #f3efe6;
            color: #1c1b19;
            font-family: "Noto Serif SC", "Songti SC", serif;
        }
        body {
            padding: 18px 16px 24px;
        }
        h1 {
            font-size: 1.15rem;
            margin: 0 0 8px;
        }
        .flow-page { max-width: none; }
        .tl-compact-page .tl-fab { display: none; }
        .tl-dock-ball {
            display: none;
        }
        .tl-compact-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }
        body.tl-collapsed {
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        body.tl-collapsed .flow-page,
        body.tl-collapsed .tl-sheet,
        body.tl-collapsed .tl-sheet-backdrop {
            display: none !important;
        }
        body.tl-collapsed .tl-dock-ball {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border: 1px solid #1c1b19;
            border-radius: 50%;
            background: #1c1b19;
            color: #f3efe6;
            font-size: 1.15rem;
            letter-spacing: 0.12em;
            cursor: pointer;
        }
    </style>
</head>
<body class="tl-compact-page">
    <script>
        if (new URLSearchParams(location.search).get('ball') === '1') {
            document.body.classList.add('tl-collapsed');
        }
    </script>
    <button type="button" class="tl-dock-ball" id="timeLogDockBall" title="记下此刻">记</button>
    <div class="flow-page">
        <div class="tl-compact-head">
            <div>
                <h1>时间节点</h1>
                <p class="flow-hint">写下才会记入日志。</p>
            </div>
            <button type="button" class="flow-ghost-btn" id="timeLogMinimizeBtn">收起</button>
        </div>
        <div class="flow-toolbar">
            <div class="flow-date-nav">
                <button type="button" id="timeLogPrevDay">前一天</button>
                <div class="flow-date-label" id="timeLogDateLabel"></div>
                <button type="button" id="timeLogNextDay">后一天</button>
            </div>
            <button type="button" class="flow-solid-btn" id="timeLogPunchBtn">记下此刻</button>
        </div>
        <div id="timeLogList" class="tl-list"></div>
        <p class="flow-empty" id="timeLogRecentHint" hidden></p>
        <div class="tl-total" id="timeLogTotal"></div>
    </div>
    <script>
        async function apiRequest(endpoint, options = {}) {
            const token = localStorage.getItem('authToken');
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers.Authorization = 'Bearer ' + token;
            const response = await fetch(endpoint, { ...options, headers });
            const text = await response.text();
            let data = null;
            try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
            if (!response.ok) {
                const detail = data && data.detail ? data.detail : '请求失败';
                throw new Error(typeof detail === 'string' ? detail : '请求失败');
            }
            return data;
        }
        function showMessage(message) {
            const total = document.getElementById('timeLogTotal');
            if (total) total.textContent = message;
        }
    </script>
    <script src="/static/js/time-log.js?v=20260918cap2"></script>
</body>
</html>
