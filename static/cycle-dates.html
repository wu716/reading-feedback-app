<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>调整计划周期 · 书然</title>
<link rel="stylesheet" href="/static/css/cycle-dates.css?v=20261109stage3a"><script defer src="/static/js/cycle-dates.js?v=20261109stage3a"></script></head>
<body><header class="site"><a href="/static/projects.html">书然</a><span>项目 · 计划周期与复盘</span></header><main><a id="back" href="/static/projects.html">← 返回计划周期</a><h1>调整计划周期</h1><p id="intro" class="muted">正在读取计划…</p><div id="error" class="error" role="alert" hidden></div><form id="editor" hidden><section class="card"><h2>新的周期范围</h2><div class="dates"><label>开始日期<input name="start_date" type="date" required></label><label>结束日期<input name="end_date" type="date" required></label></div><p class="muted">改期后，周期投入统计按新范围重新显示。原计划内容、任务、已记录投入保持原记录。</p></section><section class="card"><h2>未完成反馈节点 · 逐条决定日期</h2><p>每个节点都可以保留原日期，或指定新日期。默认保留原日期，不自动推迟。</p><div id="editable"></div></section><section class="card"><h2>保存前核对</h2><div id="summary" aria-live="polite"></div><p id="impact" class="impact" role="status"></p><p class="muted">移动节点后，未发出的提醒按新日期计算；已发出的通知保留原记录。</p></section><section class="card"><h2>已有提交或已跳过的节点</h2><div id="fixed"></div><p class="muted">这些节点保持原日期。提交版本、检查结果和历史用时不会改写。</p></section><div class="actions"><a id="cancel" href="/static/projects.html">返回，不保存</a><button type="submit">确认周期及节点日期</button></div><p id="status" role="status"></p></form></main></body></html>
