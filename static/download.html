<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>更新书然 App</title>
    <link rel="icon" href="/static/icons/app-icon-1024.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            color: #1a1a2e;
            background: linear-gradient(160deg, #667eea 0%, #764ba2 100%);
            padding: 24px 16px 40px;
        }
        .card {
            max-width: 420px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            padding: 28px 22px 24px;
            box-shadow: 0 18px 50px rgba(40, 20, 80, 0.28);
        }
        .icon {
            width: 88px;
            height: 88px;
            border-radius: 20px;
            display: block;
            margin: 0 auto 16px;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }
        h1 { text-align: center; font-size: 1.6rem; margin-bottom: 6px; }
        .sub { text-align: center; color: #666; font-size: 0.95rem; margin-bottom: 22px; }
        .meta { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 16px; min-height: 1.2em; }
        .btn {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            border: none;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }
        .btn-primary[disabled] { opacity: 0.45; cursor: not-allowed; }
        .btn-ghost {
            margin-top: 10px;
            background: #f4f2fb;
            color: #5a4b8c;
        }
        .tips {
            margin-top: 22px;
            background: #f7f5ff;
            border-radius: 12px;
            padding: 14px 14px 8px;
            font-size: 0.9rem;
            color: #444;
            line-height: 1.55;
        }
        .tips h2 { font-size: 0.95rem; color: #5a4b8c; margin-bottom: 8px; }
        .tips ol { padding-left: 18px; margin-bottom: 10px; }
        .tips li { margin-bottom: 6px; }
        .warn {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #fff4e5;
            color: #8a5a00;
            font-size: 0.85rem;
        }
        .wechat-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.84);
            color: #fff;
            z-index: 99;
            padding: 12px 20px;
        }
        .wechat-mask.show { display: block; }
        .arrow {
            text-align: right;
            font-size: 2.4rem;
            line-height: 1;
            padding-right: 6px;
        }
        .wechat-copy {
            margin-top: 28px;
            font-size: 1.05rem;
            line-height: 1.7;
        }
        .wechat-copy strong { color: #ffe08a; }
    </style>
</head>
<body>
    <div class="wechat-mask" id="wechatMask">
        <div class="arrow">↗</div>
        <div class="wechat-copy">
            请点击右上角 <strong>···</strong><br>
            选择 <strong>在浏览器中打开</strong><br>
            再用浏览器下载安装包。<br><br>
            微信里无法直接下载 APK。
        </div>
    </div>

    <div class="card">
        <img class="icon" src="/static/icons/app-icon-1024.png" alt="书然">
        <h1>书然</h1>
        <p class="sub" id="subText">覆盖安装，账号数据会保留</p>
        <p class="meta" id="meta">正在检查安装包…</p>
        <a class="btn btn-primary" id="downloadBtn" href="/download/apk" style="pointer-events:none;opacity:0.45;">立即更新</a>
        <p class="warn" id="inAppHint" style="display:none;">当前页面在应用内打开，无法直接安装。请点击右上角 <strong>···</strong>，选择 <strong>在浏览器中打开</strong>，再点「立即更新」。</p>
        <button type="button" class="btn btn-ghost" id="copyBtn">复制下载链接</button>
        <p class="warn">已安装书然时，打开安装包选择「更新」即可，不必卸载。</p>
        <div class="tips">
            <h2>安装说明</h2>
            <ol>
                <li>使用系统浏览器打开本页并下载安装包</li>
                <li>允许该浏览器安装应用</li>
                <li>选择「更新」，不要卸载</li>
            </ol>
        </div>
    </div>

    <script>
        const inWeChat = /MicroMessenger/i.test(navigator.userAgent || "");
        const inShuranApp = /ShuranApp/i.test(navigator.userAgent || "") || !!window.ShuranNative;
        const hasNativeUpdater = !!(window.ShuranNative && typeof window.ShuranNative.checkUpdate === "function");
        const fromApp = /(?:^|[?&])from=app(?:&|$)/.test(window.location.search) || inShuranApp;
        const mask = document.getElementById("wechatMask");
        const btn = document.getElementById("downloadBtn");
        const meta = document.getElementById("meta");
        const copyBtn = document.getElementById("copyBtn");
        const inAppHint = document.getElementById("inAppHint");
        const pageUrl = window.location.origin + "/download";

        if (inWeChat) {
            mask.classList.add("show");
        }
        if (fromApp && !hasNativeUpdater && inAppHint) {
            inAppHint.style.display = "block";
        }

        async function loadInfo() {
            try {
                const res = await fetch("/download/info", { cache: "no-store" });
                const data = await res.json();
                if (!data.available) {
                    meta.textContent = "安装包暂不可用，请稍后重试";
                    btn.style.pointerEvents = "none";
                    btn.style.opacity = "0.45";
                    return;
                }
                const version = data.versionName ? ("v" + data.versionName + " · ") : "";
                meta.textContent = version + "约 " + data.size_mb + " MB";
                btn.style.pointerEvents = "auto";
                btn.style.opacity = "1";
            } catch (e) {
                meta.textContent = "无法检查安装包，请稍后重试";
            }
        }

        btn.addEventListener("click", function (event) {
            if (inWeChat) {
                event.preventDefault();
                mask.classList.add("show");
                return;
            }
            if (hasNativeUpdater) {
                event.preventDefault();
                window.ShuranNative.checkUpdate();
            }
        });

        copyBtn.addEventListener("click", async function () {
            try {
                await navigator.clipboard.writeText(pageUrl);
                copyBtn.textContent = "已复制，发给对方即可";
            } catch (e) {
                prompt("请复制这个链接发给对方：", pageUrl);
            }
        });

        loadInfo();
    </script>
</body>
</html>
